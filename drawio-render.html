<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://www.drawio.org/js/mxClient.min.js"></script>
  <script src="https://www.drawio.org/js/mxClient.js"></script>
  <style>
    body { margin: 0; padding: 0; background: #fff; }
    #graph-container { width: 100vw; height: 100vh; overflow: hidden; }
  </style>
</head>
<body>
  <div id="graph-container"></div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const xmlFile = params.get('xml');
    
    if (xmlFile) {
      fetch(xmlFile)
        .then(r => r.text())
        .then(xml => {
          // Extract the mxGraphModel from the mxfile
          const parser = new DOMParser();
          const doc = parser.parseFromString(xml, 'text/xml');
          const diagram = doc.querySelector('diagram');
          const model = diagram.querySelector('mxGraphModel');
          const root = model.querySelector('root');
          
          // Create the graph
          const container = document.getElementById('graph-container');
          const graph = new mxGraph(container);
          graph.enableGrid = true;
          graph.grid = 10;
          
          // Decode the model
          const codec = new mxCodec(graph);
          const modelNode = model.cloneNode(true);
          // Remove the root element from modelNode since we'll use it directly
          codec.decode(modelNode, graph.getModel());
          
          // Fit to page
          graph.fit(20);
          
          // Signal that rendering is complete
          window.renderComplete = true;
        })
        .catch(e => {
          console.error(e);
          window.renderError = e.message;
        });
    }
  </script>
</body>
</html>
